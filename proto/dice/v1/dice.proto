syntax = "proto3";

package dice.v1;

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message DieThrowSpec {
  uint32 die_index = 1;
  // Legacy initial-position field retained for compatibility. Version 4 uses
  // table_position for x/z and position.y for the spawn height.
  Vector3 position = 2;
  Quaternion rotation = 3;
  Vector3 impulse = 4;
  Vector3 torque = 5;
  string die_id = 6;
  NormalizedTablePosition table_position = 7;
  string die_definition_id = 8;
}

// RollSpec is shared animation input. Clients intentionally do not promise
// deterministic replay across devices or simulation implementations.
message RollSpec {
  uint32 simulation_version = 1;
  string roll_id = 2;
  repeated DieThrowSpec dice = 3;
}

enum RollMode {
  ROLL_MODE_UNSPECIFIED = 0;
  ROLL_MODE_ADD_NEW = 1;
  ROLL_MODE_REROLL_EXISTING = 2;
}

// DieFace identifies the physical upward face. Clients combine it with the
// fixed die_definition_id catalog entry to derive the visible letter.
enum DieFace {
  DIE_FACE_UNSPECIFIED = 0;
  DIE_FACE_ONE = 1;
  DIE_FACE_TWO = 2;
  DIE_FACE_THREE = 3;
  DIE_FACE_FOUR = 4;
  DIE_FACE_FIVE = 5;
  DIE_FACE_SIX = 6;
}

message DieResult {
  uint32 die_index = 1;
  DieFace face = 2;
  string die_id = 3;
  string die_definition_id = 4;
}

message RollResult {
  uint32 simulation_version = 1;
  string roll_id = 2;
  repeated DieResult dice = 3;
  reserved 4;
  reserved "total";
}

message NormalizedTablePosition {
  float u = 1;
  float v = 2;
}

message TableDieState {
  string die_id = 1;
  DieFace face = 2;
  NormalizedTablePosition position = 3;
  string owner_player_id = 4;
  uint64 revision = 5;
  string die_definition_id = 6;
}

message DiePlacement {
  string die_id = 1;
  NormalizedTablePosition position = 2;
}

message TableSnapshot {
  string table_id = 1;
  uint64 revision = 2;
  repeated TableDieState dice = 3;
}

message RollStarted {
  string roll_id = 1;
  string roller_id = 2;
  RollMode mode = 3;
  RollSpec animation_spec = 4;
}

message RollCompleted {
  string roll_id = 1;
  string roller_id = 2;
  RollResult result = 3;
  repeated DiePlacement changed_placements = 4;
  RollSpec animation_spec = 5;
}

message DragStarted {
  string die_id = 1;
  string player_id = 2;
  string interaction_id = 3;
  uint64 sequence = 4;
  NormalizedTablePosition position = 5;
}

message DragUpdated {
  string die_id = 1;
  string player_id = 2;
  string interaction_id = 3;
  uint64 sequence = 4;
  NormalizedTablePosition position = 5;
}

message DragEnded {
  string die_id = 1;
  string player_id = 2;
  string interaction_id = 3;
  uint64 sequence = 4;
  NormalizedTablePosition position = 5;
}

// TableEvent can back a later snapshot-plus-event-stream transport. The
// frontend already applies local actions through this same event envelope.
message TableEvent {
  string table_id = 1;
  uint64 revision = 2;

  oneof payload {
    RollStarted roll_started = 3;
    RollCompleted roll_completed = 4;
    DragStarted drag_started = 5;
    DragUpdated drag_updated = 6;
    DragEnded drag_ended = 7;
    TableSnapshot snapshot = 8;
  }
}
